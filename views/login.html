<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | FairPour</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/images/favicon-64.png" type="image/png">
<style>
  :root { --navy: #1b2236; --burgundy: #7a2431; --cream: #f6efe4; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--navy); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1.5rem; }
  .card { width: 100%; max-width: 380px; background: #fff; border-radius: 18px; padding: 2.2rem; text-align: center; border-top: 6px solid var(--burgundy); box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); }
  img { width: 110px; height: 110px; margin: 0 auto 1rem; display: block; }
  h1 { font-family: Georgia, serif; color: var(--navy); font-size: 1.5rem; margin: 0 0 .3rem; }
  p.sub { color: #6e6a75; margin: 0 0 1.5rem; font-size: .95rem; }
  input { width: 100%; padding: .9rem 1rem; border: 1.5px solid #ddd6cc; border-radius: 10px; font-size: 1rem; margin-bottom: 1rem; }
  input:focus { outline: none; border-color: #c9773f; box-shadow: 0 0 0 3px rgba(201,119,63,.2); }
  button { width: 100%; padding: .95rem; border: 0; border-radius: 999px; background: var(--burgundy); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:hover { background: #5e1a25; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { color: var(--burgundy); font-weight: 600; min-height: 1.3em; margin: .9rem 0 0; font-size: .92rem; }
</style>
</head>
<body>
  <form class="card" id="login">
    <img src="/images/logo-512.png" alt="FairPour Coffee Roasters">
    <h1>Inquiry Dashboard</h1>
    <p class="sub">Enter the admin password to continue.</p>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign In</button>
    <p class="msg" role="alert"></p>
  </form>
<script>
  const f = document.getElementById('login'), msg = f.querySelector('.msg'), btn = f.querySelector('button');
  fetch('/admin/api/status').then(r => r.json()).then(s => {
    if (!s.configured) { msg.textContent = 'Login is disabled until ADMIN_PASSWORD (8+ characters) is set on the server.'; btn.disabled = true; }
  }).catch(() => {});
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); msg.textContent = ''; btn.disabled = true;
    try {
      const r = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: f.password.value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Sign-in failed.');
      location.href = '/admin';
    } catch (err) { msg.textContent = err.message; btn.disabled = false; }
  });
</script>
</body>
</html>
